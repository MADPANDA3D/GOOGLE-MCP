name: Bug report
description: Report a reproducible GOOGLE-MCP defect with synthetic data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include OAuth credentials, authorization headers, private URLs, user identifiers, or raw Google data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Access mode
      options: [standalone, portal]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use placeholders and synthetic Google resources only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, private topology, and raw provider responses.
          required: true
