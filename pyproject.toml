[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "madpanda-google-mcp"
version = "1.0.2"
description = "Dual-mode, request-scoped BYOK MCP server for Google Workspace and Google APIs"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{ name = "MADPANDA3D" }]
keywords = ["mcp", "fastmcp", "google", "google-workspace", "byok", "ai-agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "google-api-python-client>=2.198.0,<3",
  "google-auth>=2.56.0,<3",
  "google-auth-httplib2>=0.4.0,<1",
  "google-auth-oauthlib>=1.4.0,<2",
  "mcp>=1.28.1,<2",
  "starlette>=1.3.1,<2",
  "uvicorn>=0.51.0,<1",
]

[project.urls]
Homepage = "https://github.com/MADPANDA3D/GOOGLE-MCP"
Documentation = "https://github.com/MADPANDA3D/GOOGLE-MCP#readme"
Issues = "https://github.com/MADPANDA3D/GOOGLE-MCP/issues"
Security = "https://github.com/MADPANDA3D/GOOGLE-MCP/security/policy"
Source = "https://github.com/MADPANDA3D/GOOGLE-MCP"

[project.scripts]
madpanda-google-mcp = "google_mcp_server:main"

[dependency-groups]
dev = [
  "bandit[toml]>=1.9.2,<2",
  "build>=1.3.0,<2",
  "httpx2>=2.7.0,<3",
  "isort>=8.0.1,<9",
  "mypy>=2.3.0,<3",
  "pip-audit>=2.9.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.3.0,<2",
  "ruff>=0.14.0,<1",
  "twine>=6.2.0,<7",
]

[tool.setuptools]
package-dir = { "" = "fastmcp" }
py-modules = ["google_auth_local", "google_mcp_server", "tool_manifest"]
include-package-data = false

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["fastmcp"]
testpaths = ["fastmcp/tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dist", "build"]

[tool.ruff.lint]
# Keep the first release gate focused on correctness defects. Broader style
# modernization is intentionally separate from the security/product cutover.
select = ["E9", "F63", "F7", "F82"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["fastmcp", "scripts"]

[tool.bandit]
exclude_dirs = ["fastmcp/tests"]
skips = ["B104"]
