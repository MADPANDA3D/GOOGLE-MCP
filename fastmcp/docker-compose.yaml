services:
  google-mcp:
    image: google-mcp-google-mcp:${MCP_BUILD_SHA:-dev}
    build:
      context: .
      args:
        MCP_BUILD_SHA: ${MCP_BUILD_SHA:-unknown}
        MCP_IMAGE_VERSION: google-2026.07.12.1
    container_name: google-mcp
    restart: unless-stopped
    init: true
    env_file:
      - .env
    volumes:
      - ./.google:/app/.google:ro
    expose:
      - "8086"
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8086/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - mcp-network

networks:
  mcp-network:
    external: true
